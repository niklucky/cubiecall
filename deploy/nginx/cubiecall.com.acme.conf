# First deploy only: serves the ACME challenge until a certificate exists,
# then deploy/install.sh swaps in cubiecall.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name cubiecall.com www.cubiecall.com cubycall.com www.cubycall.com quipcall.com www.quipcall.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cubie-acme;
        try_files $uri =404;
    }

    location / {
        return 307 https://cubiecall.com$request_uri;
    }
}
