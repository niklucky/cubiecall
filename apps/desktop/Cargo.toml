[package]
name = "cubie-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Dev only: CUBIE_SNAPSHOT_DIR=… renders every window to PNG (see src/snapshot.rs).
snapshot = ["gpui_platform/test-support", "dep:image"]

[dependencies]
cubie-core.workspace = true
cubie-protocol.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["font-kit", "runtime_shaders"] }
anyhow = "1.0.104"
tracing = "0.1.44"
parking_lot = "0.13.0"
async-channel = "2.5.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSWindow", "NSView", "NSResponder", "NSScreen", "NSGraphics", "NSButton", "NSControl", "NSWorkspace", "NSMenu", "NSMenuItem", "NSSound", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSEnumerator", "NSError", "NSGeometry", "NSNotification", "NSOperation", "NSPathUtilities", "NSRunLoop", "NSString", "NSTimeZone", "block2"] }
block2 = "0.6"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "CATransform3D", "objc2-core-foundation", "objc2-core-graphics"] }

# Windows: what GPUI doesn't expose (window shapes and placement, the cursor,
# menus, Credential Manager), and BGRA frames for GPUI's image sprites.
[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
