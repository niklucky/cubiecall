      <stop offset="1" stop-color="#c6d7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quby-peach" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(977 839) scale(475 471)">
      <stop stop-color="#ffe0cf"/>
      <stop offset="0.42" stop-color="#ffe0cf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe0cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quby-pink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(353 866) scale(390 340)">
