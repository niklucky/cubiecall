    <clipPath id="quby-body-clip"><use href="#quby-body"/></clipPath>
    <linearGradient id="quby-base" x1="626" y1="237" x2="626" y2="1016" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cbdcff"/>
      <stop offset="0.43" stop-color="#e2e3f4"/>
      <stop offset="1" stop-color="#ffe7f5"/>
    </linearGradient>
    <radialGradient id="quby-ivory" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(283 509) scale(437 449)">
      <stop offset="0.05" stop-color="#ffffe9"/>
      <stop offset="0.38" stop-color="#ffffe9" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffe9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="quby-blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(764 370) scale(371 324)">
