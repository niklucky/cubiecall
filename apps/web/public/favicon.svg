<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="207 207 840 840" role="img" aria-labelledby="quby-title quby-description">
  <title id="quby-title">Quby</title>
  <desc id="quby-description">A softly rounded pastel cube with a black face and two ivory pill eyes. Transparent background.</desc>
  <defs>
