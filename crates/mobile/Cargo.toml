[package]
name = "quipcall-mobile"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "quipcall_mobile"
# A static library for the iOS app; a plain one so the workspace checks it.
crate-type = ["staticlib", "lib"]

[dependencies]
# The call engine without the desktop's noise model and speech to text.
quipcall-core = { path = "../core", default-features = false }
# Typed Swift and Kotlin bindings from one Rust definition.
uniffi = "0.32"
anyhow = "1.0.104"
async-channel = "2.5.0"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }

[target.'cfg(target_os = "ios")'.dependencies]
# The session in the Keychain (already in the tree, under native-tls).
security-framework = "3"

[target.'cfg(target_vendor = "apple")'.dependencies]
# Frames into the view's AVSampleBufferDisplayLayer.
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMFormatDescription", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
