[package]
name = "cubie-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Desktop gets both. Phones leave them out: iOS and Android suppress noise in
# the system's voice processing, and nothing transcribes there yet.
default = ["denoise", "transcribe"]
# DeepFilterNet 3 on the microphone (17.6 MB of binary).
denoise = ["dep:deep_filter", "dep:ndarray", "dep:tract-onnx"]
# Speech to text on this device (transcribe.cpp; needs cmake).
transcribe = ["dep:cubie-stt"]

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
futures-util = "0.3.34"
livekit = { version = "0.10.0", features = ["native-tls"] }
# DeepFilterNet 3 noise suppression, run with tract; the model (~8 MB) is embedded.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model"], optional = true }
ndarray = { version = "0.15", optional = true }
# Not used directly: deep_filter needs tract 0.21.4 (0.21.7+ moved to ndarray 0.16).
tract-onnx = { version = "=0.21.4", optional = true }
parking_lot = "0.13.0"
cubie-protocol.workspace = true
cubie-stt = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde_json = "1.0.154"
# Checks downloaded models (already in the tree for LiveKit's tokens).
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1.44"

# Capture, permissions and pixel buffers: the same frameworks on macOS and iOS.
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-media", "objc2-core-video", "block2", "dispatch2", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat", "AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings", "AVPlayer", "AVPlayerItem", "AVCaptureAudioDataOutput"] }
# Recordings: AVAssetWriter takes PCM in CMSampleBuffers (all system frameworks).
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMSampleBuffer", "CMTime", "CMFormatDescription", "CMAttachment", "objc2-core-video", "objc2-core-audio-types"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSArray", "NSURL"] }

# Screen capture is the Mac's.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGDirectDisplay"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCShareableContent", "SCStream", "SCScreenshotManager", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

# The camera on Windows: Media Foundation's source reader (GPUI already
# builds this version of the crate).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[[example]]
name = "denoise_eval"
required-features = ["denoise"]

[dev-dependencies]
# RNNoise, only to compare against in examples/denoise_eval.rs.
nnnoiseless = { version = "0.5", default-features = false }
