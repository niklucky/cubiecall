name: Temporary signing preflight
on:
  push:
    branches: ['t3/macos-app-signing-notarization']
permissions:
  contents: read
jobs:
  signing:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: deploy/mac/sparkle.sh
      - name: Configure credentials
        timeout-minutes: 2
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: deploy/mac/ci-signing.sh
      - name: Find Developer ID identity
        timeout-minutes: 1
        run: security find-identity -v -p codesigning "$CUBIE_SIGNING_KEYCHAIN"
      - name: Read notarization profile
        timeout-minutes: 1
        run: xcrun notarytool history --keychain-profile cubie-notary --keychain "$CUBIE_NOTARY_KEYCHAIN" --output-format json >/dev/null
      - name: Read Sparkle public key
        timeout-minutes: 1
        run: target/sparkle-2.10.1/bin/generate_keys --account com.quipcall.desktop -p
      - name: Sign a minimal executable
        timeout-minutes: 1
        run: |
          printf 'int main(void) { return 0; }\n' > "$RUNNER_TEMP/check.c"
          xcrun clang "$RUNNER_TEMP/check.c" -o "$RUNNER_TEMP/check"
          codesign --force --keychain "$CUBIE_SIGNING_KEYCHAIN" --sign FB9D41EDF844DF368B68B049D8A9895D5C5F0B96 --options runtime --timestamp "$RUNNER_TEMP/check"
          codesign --verify --strict "$RUNNER_TEMP/check"
      - name: Cleanup
        if: always()
        run: |
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/cubie-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cubie-signing.p12" "$RUNNER_TEMP/cubie-sparkle-key"
